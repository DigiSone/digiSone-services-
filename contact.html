<!DOCTYPE html>
<html lang="en"><head><meta charset="UTF-8"><title>Contact | DigiSone</title><link rel="stylesheet" href="style.css"></head>
<body>
    <div id="preloader"><div>DigiSone <span>Services</span></div></div>
    <nav class="navbar"><a href="index.html" class="logo"><i class="fa-solid fa-cube"></i> DigiSone <span>Services</span></a><ul class="nav-links"><li><a href="index.html">Home</a></li><li><a href="contact.html" class="active">Contact</a></li></ul></nav>
    <header class="page-header"><h1 class="reveal">Get in Touch</h1><p class="reveal">Let's build something great together.</p></header>
    <section class="section" style="max-width: 600px; margin: 0 auto;">
        <form style="display: flex; flex-direction: column; gap: 20px;" onsubmit="event.preventDefault(); showToast('Message Sent Successfully!');">
            <input type="text" placeholder="Your Name" style="padding: 15px; border-radius: 8px; border: 1px solid rgba(255,255,255,0.1); background: var(--surface); color: white;" required>
            <input type="email" placeholder="Your Email" style="padding: 15px; border-radius: 8px; border: 1px solid rgba(255,255,255,0.1); background: var(--surface); color: white;" required>
            <textarea placeholder="Your Message" rows="5" style="padding: 15px; border-radius: 8px; border: 1px solid rgba(255,255,255,0.1); background: var(--surface); color: white;" required></textarea>
            <button type="submit" class="btn-primary">Send Message</button>
        </form>
    </section>
    <div id="toast" class="toast" style="position:fixed;bottom:-100px;background:#10b981;color:white;padding:12px 24px;border-radius:8px;left:50%;transform:translateX(-50%);transition:0.4s;z-index:9999;">Success</div>
    <footer><div class="footer-bottom">&copy; 2024 DigiSone Global.</div></footer><script src="script.js"></script>
</body></html>
